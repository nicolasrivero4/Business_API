services:

  db:
    image: postgres:18

    container_name: business_api_db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
  
  api:
    build: .

    container_name: business_api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db

volumes:

  postgres_data:
